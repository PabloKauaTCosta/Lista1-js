<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Desconto em produto</title>
</head>
<body>
    <script>
        let precoOriginal = Number(prompt("Informe o preço original do produto:"));
        let valorDesconto = precoOriginal * 10 / 100;
        let precoFinal = precoOriginal - valorDesconto;

        alert("O desconto é de: R$" + valorDesconto.toFixed(2));
        alert("O total a pagar com 10% de desconto é: R$ " + precoFinal.toFixed(2));  
    </script>
</body>
</html>
