<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Comissão do vendedor</title>
</head>
<body>
    <script>
        let totalVendas = Number(prompt("Informe o valor total das vendas feitas no mês:"));
        let comisVendendor  = totalVendas * 5 / 100;
  
        alert("O valor total das vendas é de: R$" + totalVendas);
        alert("O valor da comissão do vendendor é de: R$" + comisVendendor);
    </script>
</body>
</html>
