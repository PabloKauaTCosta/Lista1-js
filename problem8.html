<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Aumento de preço de produto</title>
</head>
<body>
    <script>
        let precoInicial = Number(prompt("Informe o preço atual do produto:"))
        let novoPreco = precoInicial * 15 / 100
        let diferencaValor = novoPreco - novoPreco
        
        alert("O valor antigo do produto é de R$" + precoInicial + " e teve um aumento de R$" + diferencaValor + ", ficando com um novo valor de R$" + novoPreco)
    </script>
</body>
</html>
