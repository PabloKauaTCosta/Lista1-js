<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Cálculo de lucro em venda de produtos</title>
</head>
<body>
    <script>
        let valorFornecedor = 25.00;
        let valorVenda = 40.00;
        let quantVendida = Number(prompt("Informe a quantidade de camisas vendidas:"));
        let quantSemLucro = valorFornecedor * quantVendida;
        let QuantComLucro = valorVenda * quantVendida;
        let lucroVenda = QuantComLucro - quantSemLucro;

        alert("Valor total de lucros é: R$" + lucroVenda);
    </script>
</body>
</html>
