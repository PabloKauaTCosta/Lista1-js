<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Cálculo de lucro em venda de produtos</title>
</head>
<body>
    <script>
        let valorFornecedor = 25.00
        let valorVenda = 40.00
        let quantVendido = Number(prompt("Quantas camisas compradas?"))
        let quantSemLucro = valorFornecedor * quantVendido
        let QuantComLucro = valorVenda * quantVendido
        let lucroVenda = QuantComLucro - quantSemLucro

        alert("Valor total de lucros: R$" + lucroVenda)
    </script>
</body>
</html>
