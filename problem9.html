<!DOCTYPE html>
<html lang="pt-br">
<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <meta http-equiv="X-UA-Compatible" content="ie=edge">
   <title>Cálculo de parcelas</title>
</head>
<body>
   <script>
        let valorTotal = Number(prompt("Informe o valor total da compra: "));
        let valorParcela = valorTotal / 5;

        alert("Valor total da compra: " + valorTotal +  " reais.");
        alert("Número de parcelas: 5 " + "." + " Valor de cada parcela: " + valorParcela);
    </script>
</body>
</html>
