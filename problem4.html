<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Juros simples em empréstimo</title>
</head>
<body>
    <script>
        let valorEmprestimo = 1000;
        let porcentagemEmprestimo = valorEmprestimo * 5 / 100;
        let quantMes = Number(prompt("Em quantos meses você pretende quitar sua dívida?"));
        let valorPagar = (valorEmprestimo / quantMes) + porcentagemEmprestimo;

        alert(valorPagar);
    </script>
</body>
</html>
