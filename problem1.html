<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cálculo do valor total de uma compra</title>
</head>
<body>
    <style>
     
    </style>
    <script>
        let quantCaderno = Number(prompt("Informe a quantidade de cadernos: "))
        let totalAPagar
        const precoCaderno = 12.50;

        totalAPagar = quantCaderno * precoCaderno

        alert("O valor total a pagar é de: R$" + totalAPagar + 
        "  Quantidade de cadernos comprados: " + quantCaderno)



    </script>
</body>
</html>
