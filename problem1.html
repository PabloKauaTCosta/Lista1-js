<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cálculo do valor total de uma compra</title>
</head>
<body>
    <script>
        let quantCaderno = Number(prompt("Informe a quantidade de cadernos:"));
        let precoCaderno = 12.50;
        let totalAPagar = precoCaderno * quantCaderno;

        alert("O valor total a pagar de " + quantCaderno + " cadernos é de R$" + totalAPagar);
    </script>
</body>
</html>
